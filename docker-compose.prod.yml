services:
  postgres:
    image: postgres:16-alpine
    container_name: family-menu-db
    restart: always
    environment:
      POSTGRES_USER: family
      POSTGRES_PASSWORD: family
      POSTGRES_DB: family_menu
    ports:
      - '5435:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U family -d family_menu']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: family-menu-backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://family:family@postgres:5432/family_menu?schema=public
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
    # Run migrations before starting the server
    command: sh -c "npx prisma migrate deploy && npm run start"

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: family-menu-frontend
    restart: always
    ports:
      - '80:80'
    depends_on:
      - backend

volumes:
  postgres_data:
