
services:
  postgres:
    image: postgres:16-alpine
    container_name: make-me-menu-db
    environment:
      POSTGRES_USER: family
      POSTGRES_PASSWORD: family
      POSTGRES_DB: make_me_menu
    ports:
      - '5435:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U family -d make_me_menu']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
