
services:
  postgres:
    image: postgres:16-alpine
    container_name: family-menu-db
    environment:
      POSTGRES_USER: family
      POSTGRES_PASSWORD: family
      POSTGRES_DB: family_menu
    ports:
      - '5435:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U family -d family_menu']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
